# Render Blueprint: one free web service built from the Dockerfile.
# "Deploy to Render" in the README reads this file; Render asks for the key marked sync: false.
services:
  - type: web
    name: atmos-weather
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: google
      # The demo key, used when a visitor has not added their own. Never commit it.
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      # Answers per visitor per hour on the demo key.
      - key: DEMO_ANSWERS_PER_HOUR
        value: "20"
